<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<title>Diwali Shop Ledger</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{--bg:#fff8ee;--card:#fff;--ink:#2b1a12;--mute:#7a6a5f;--red:#b91c1c;--gold:#f59e0b;--green:#15803d;--line:#efe3d3}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
  header{background:var(--red);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0}
  header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600}
  .big{font-size:30px;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .red{color:var(--red)}.green{color:var(--green)}.mute{color:var(--mute)}
  label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
  input,select{width:100%;padding:11px;border:1px solid #dccfbe;border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
  .btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--red);color:#fff;font-size:16px;font-weight:600}
  .btn.gold{background:var(--gold);color:#2b1a12}
  .btn.green{background:var(--green);color:#fff}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row .l{min-width:0}.row .l b{display:block;overflow-wrap:anywhere}
  .row small{color:var(--mute)}
  .row .r{text-align:right;white-space:nowrap}
  .tap{cursor:pointer}
  .tap .r::after{content:'›';margin-left:8px;color:#b9a99a;font-size:20px}
  .del{background:none;border:0;color:#b9a99a;font-size:18px;padding:4px 8px}
  .mini{border:1px solid var(--green);color:var(--green);background:#fff;border-radius:8px;padding:4px 8px;font-size:13px;margin-left:6px}
  .back{background:none;border:0;color:var(--red);font-size:16px;padding:0 0 12px;font-weight:600}
  .you{border:2px solid var(--gold)}
  .bar{height:8px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold)}
  .line{display:flex;justify-content:space-between;padding:4px 0}
  .line.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;padding:12px 4px;font-size:13px;color:var(--mute)}
  nav button b{display:block;font-size:20px;font-weight:400}
  nav button.on{color:var(--red);font-weight:700}
  .login{max-width:360px;margin:12vh auto;padding:0 16px;text-align:center}
  .login h1{color:var(--red)}
  .err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
  .demo{background:#fef3c7;color:#92400e;font-size:12px;text-align:center;padding:4px}
</style>
</head>

<script>

const SUPABASE_URL = "https://kkuzwlquzuhfzenlfigv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtrdXp3bHF1enVoZnplbmxmaWd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxOTgwODEsImV4cCI6MjEwODc3NDA4MX0.TvfB27hzbYUIJVbnMc0VIXn3mPjEmMTQBKtMSc_cEXI";

const USERS = ['ajay','mahesh','babu','shiva','anil','sashi'];
const DOMAIN = '@diwali-shop.app';
const CATS = ['Goods / Stock','Transport','Permissions','Guide / Agent','Shop setup','Labour','Food & Misc','Other'];

const cap = s => s[0].toUpperCase() + s.slice(1);
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => new Date(d + 'T00:00').toLocaleDateString('en-IN', {day:'numeric', month:'short'});

/* ---------- data layer: Supabase, or localStorage demo when no config ---------- */
let store;
if (!DEMO) {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let reload = async () => {};
  const must = ({error}) => { if (error) throw error; };
  store = {
    login: async (u, p) => must(await sb.auth.signInWithPassword({email: u + DOMAIN, password: p})),
    logout: () => sb.auth.signOut(),
    onAuth: cb => sb.auth.onAuthStateChange((_e, s) => cb(s ? s.user.email.split('@')[0] : null)),
    subscribe: cb => {
      reload = async () => {
        const {data} = await sb.from('entries').select('*')
          .order('date', {ascending: false}).order('created', {ascending: false});
        cb((data || []).map(r => ({...r, amount: Number(r.amount), addedBy: r.added_by})));
      };
      reload();
      const ch = sb.channel('entries-live')
        .on('postgres_changes', {event: '*', schema: 'public', table: 'entries'}, () => reload())
        .subscribe();
      return () => sb.removeChannel(ch);
    },
    add: async e => {
      const {addedBy, ...row} = e;
      must(await sb.from('entries').insert({...row, added_by: addedBy}));
      reload();
    },
    remove: async id => { must(await sb.from('entries').delete().eq('id', id)); reload(); }
  };
} else {
  let cbAuth, cbData;
  const load = () => JSON.parse(localStorage.getItem('demo_entries') || '[]');
  const save = l => { localStorage.setItem('demo_entries', JSON.stringify(l)); cbData && cbData(l.slice().sort((a,b)=>b.date.localeCompare(a.date))); };
  store = {
    login: async (u) => { localStorage.setItem('demo_user', u); cbAuth(u); },
    logout: async () => { localStorage.removeItem('demo_user'); cbAuth(null); },
    onAuth: cb => { cbAuth = cb; cb(localStorage.getItem('demo_user')); },
    subscribe: cb => { cbData = cb; save(load()); return () => {}; },
    add: async e => save([...load(), {...e, id: String(Date.now()), created: Date.now()}]),
    remove: async id => save(load().filter(x => x.id !== id))
  };
}

/* ---------- state + rendering ---------- */
let me = null, entries = [], tab = 'summary', person = null, unsub = null, started = false;
const app = document.getElementById('app');

store.onAuth(u => {
  if (started && u === me) return; // ignore token-refresh repeats
  started = true;
  me = u;
  if (unsub) { unsub(); unsub = null; }
  if (u) unsub = store.subscribe(list => { entries = list; render(); });
  render();
});

function render() { me ? renderMain() : renderLogin(); }

function renderLogin() {
  const last = localStorage.getItem('last_user') || USERS[0];
  app.innerHTML = `${DEMO ? '<div class="demo">DEMO MODE – data stays on this phone only.</div>' : ''}
  <div class="login">
    <h1>🪔 Diwali Shop Ledger</h1>
    <p class="mute">Crackers retail – our shared accounts</p>
    <div class="card">
      <label>Who are you?</label>
      <select id="u">${USERS.map(u => `<option value="${u}" ${u===last?'selected':''}>${cap(u)}</option>`).join('')}</select>
      <label>Password</label>
      <div style="position:relative">
        <input id="p" type="password" autocomplete="current-password" style="padding-right:64px">
        <button type="button" id="eye" style="position:absolute;right:6px;top:6px;bottom:6px;border:0;border-radius:8px;background:#f3e8d6;color:#2b1a12;padding:0 10px;font-size:14px">Show</button>
      </div>
      <button class="btn" id="go">Login</button>
      <div class="err" id="err"></div>
    </div>
  </div>`;
  const go = async () => {
    const u = document.getElementById('u').value, p = document.getElementById('p').value;
    document.getElementById('err').textContent = '';
    try { localStorage.setItem('last_user', u); await store.login(u, p); }
    catch (e) { document.getElementById('err').textContent = 'Wrong password or login failed'; }
  };
  document.getElementById('eye').onclick = () => {
    const p = document.getElementById('p'), show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    document.getElementById('eye').textContent = show ? 'Hide' : 'Show';
  };
  document.getElementById('go').onclick = go;
  document.getElementById('p').onkeydown = e => { if (e.key === 'Enter') go(); };
}

/*
  Settlement maths, per partner:
    put in  = expenses they paid + money they handed to other partners
    took out = sales cash they collected + money they received from other partners
    share   = (total expenses − total sales) / 6   (negative once there is profit)
    balance = put in − took out − share            (+ gets back, − has to pay)
  Balances always add up to zero, so the plan below settles everyone exactly.
*/
function totals() {
  const of = t => entries.filter(e => e.type === t);
  const exp = of('expense'), sal = of('sale'), tr = of('transfer');
  const sum = l => l.reduce((a, e) => a + e.amount, 0);
  const per = (l, key) => Object.fromEntries(USERS.map(u => [u, sum(l.filter(e => e[key] === u))]));
  const spent = sum(exp), sold = sum(sal);
  const paid = per(exp, 'person'), collected = per(sal, 'person');
  const given = per(tr, 'person'), received = per(tr, 'to_person');
  const share = (spent - sold) / USERS.length;
  const bal = Object.fromEntries(USERS.map(u => [u, paid[u] + given[u] - collected[u] - received[u] - share]));
  const cats = CATS.map(c => [c, sum(exp.filter(e => e.category === c))]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  return {exp, sal, tr, spent, sold, paid, collected, given, received, share, bal, cats, plan: settlePlan(bal)};
}

// Fewest payments: biggest debtor pays biggest creditor, repeat.
function settlePlan(bal) {
  const pick = sign => USERS.map(u => ({u, v: sign * bal[u]})).filter(x => x.v >= 1).sort((a, b) => b.v - a.v);
  const debt = pick(-1), cred = pick(1), plan = [];
  let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const x = Math.min(debt[i].v, cred[j].v);
    if (Math.round(x) >= 1) plan.push({from: debt[i].u, to: cred[j].u, amount: Math.round(x)});
    debt[i].v -= x; cred[j].v -= x;
    if (debt[i].v < 1) i++;
    if (cred[j].v < 1) j++;
  }
  return plan;
}

function renderMain() {
  const t = totals();
  let body = '';
  if (person) body = personView(t, person);
  else if (tab === 'summary') body = summaryView(t);
  else if (tab === 'expense') body = formView('expense') + listView(t.exp, 'expense');
  else if (tab === 'sale') body = formView('sale') + listView(t.sal, 'sale');
  else if (tab === 'settle') body = planCard(t) + formView('transfer') + listView(t.tr, 'transfer');

  const tabs = [['summary','📊','Summary'],['expense','💸','Expenses'],['sale','🧨','Sales'],['settle','🤝','Settle']];
  app.innerHTML = `${DEMO ? '<div class="demo">DEMO MODE – data stays on this phone only</div>' : ''}
  <header><h1>🪔 Diwali Shop Ledger</h1><button id="out">${cap(me)} · Logout</button></header>
  <main>${body}</main>
  <nav>${tabs.map(([k,i,n]) => `<button data-t="${k}" class="${tab===k && !person?'on':''}"><b>${i}</b>${n}</button>`).join('')}</nav>`;

  document.getElementById('out').onclick = () => store.logout();
  app.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; person = null; render(); window.scrollTo(0,0); });
  app.querySelectorAll('[data-p]').forEach(r => r.onclick = () => { person = r.dataset.p; render(); window.scrollTo(0,0); });
  const back = document.getElementById('back');
  if (back) back.onclick = () => { person = null; render(); };
  const f = document.getElementById('f');
  if (f) f.onsubmit = submit;
  app.querySelectorAll('.del').forEach(b => b.onclick = () => {
    if (confirm('Delete this entry?')) store.remove(b.dataset.id);
  });
  app.querySelectorAll('.paid').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const {from, to, amount} = b.dataset;
    if (confirm(`Record that ${cap(from)} paid ${inr(amount)} to ${cap(to)}?`))
      saveEntry({type: 'transfer', amount: Number(amount), person: from, to_person: to, note: 'Settlement', date: today(), addedBy: me});
  });
}

const statusText = v => Math.abs(v) < 1 ? ['All settled', 'mute'] : v > 0 ? ['Gets back ' + inr(v), 'green'] : ['Has to pay ' + inr(-v), 'red'];

function summaryView(t) {
  const profit = t.sold - t.spent;
  const maxCat = t.cats.length ? t.cats[0][1] : 1;
  const [myText, myCls] = statusText(t.bal[me]);
  const mine = t.plan.filter(p => p.from === me || p.to === me);
  return `
  <div class="card you tap" data-p="${me}"><h2>Your account, ${cap(me)}</h2>
    <div class="big ${myCls}">${myText}</div>
    ${mine.map(p => `<div>${p.from === me ? `Pay <b>${inr(p.amount)}</b> to <b>${cap(p.to)}</b>` : `Get <b>${inr(p.amount)}</b> from <b>${cap(p.from)}</b>`}</div>`).join('')}
    ${t.received[me] ? `<small class="mute">Already received ${inr(t.received[me])} from partners – counted.</small>` : ''}
    <div class="mute" style="margin-top:6px;font-size:13px">Tap for full details ›</div>
  </div>
  <div class="grid">
    <div class="card"><h2>Spent till now</h2><div class="big red">${inr(t.spent)}</div></div>
    <div class="card"><h2>Sold till now</h2><div class="big green">${inr(t.sold)}</div></div>
  </div>
  <div class="card"><h2>${profit >= 0 ? 'Profit so far' : 'Still to recover'}</h2>
    <div class="big ${profit >= 0 ? 'green' : 'red'}">${inr(Math.abs(profit))}</div>
    <small class="mute">Sales − Expenses · ${profit >= 0 ? 'each gets' : 'each bears'} ${inr(Math.abs(t.share))}</small></div>

  ${planCard(t)}

  <div class="card"><h2>Partners (tap a name)</h2>
    ${USERS.map(u => { const [txt, cls] = statusText(t.bal[u]); return `<div class="row tap" data-p="${u}"><div class="l"><b>${cap(u)}</b><small>paid ${inr(t.paid[u])}${t.given[u] ? ' · gave ' + inr(t.given[u]) : ''}${t.received[u] ? ' · received ' + inr(t.received[u]) : ''}</small></div>
      <div class="r ${cls}"><b>${txt}</b></div></div>`; }).join('')}
  </div>

  <div class="card"><h2>Spent by category</h2>
    ${t.cats.length ? t.cats.map(([c, v]) => `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><span>${esc(c)}</span><b>${inr(v)}</b></div><div class="bar"><i style="width:${v/maxCat*100}%"></i></div></div>`).join('') : '<span class="mute">No expenses yet</span>'}
  </div>`;
}

function planCard(t) {
  return `<div class="card"><h2>Who pays whom</h2>
    ${t.plan.length ? t.plan.map(p => `<div class="row"><div class="l"><b>${cap(p.from)} → ${cap(p.to)}</b><small>${cap(p.from)} pays ${cap(p.to)}</small></div>
      <div class="r"><b>${inr(p.amount)}</b><button class="mini paid" data-from="${p.from}" data-to="${p.to}" data-amount="${p.amount}">Paid ✓</button></div></div>`).join('')
      : '<span class="mute">Everyone is settled 🎉</span>'}
    <small class="mute">Counts expenses paid, sales cash collected and money already given between partners. Tap "Paid ✓" once the money is handed over.</small>
  </div>`;
}

function personView(t, u) {
  const [txt, cls] = statusText(t.bal[u]);
  const mine = t.plan.filter(p => p.from === u || p.to === u);
  const exp = t.exp.filter(e => e.person === u);
  const sal = t.sal.filter(e => e.person === u);
  const tr = t.tr.filter(e => e.person === u || e.to_person === u);
  const line = (label, v, sign) => v ? `<div class="line"><span>${label}</span><b>${sign}${inr(v)}</b></div>` : '';
  return `<button class="back" id="back">‹ Back</button>
  <div class="card ${u === me ? 'you' : ''}"><h2>${cap(u)}</h2>
    <div class="big ${cls}">${txt}</div>
    ${mine.length ? mine.map(p => `<div class="row"><div class="l"><b>${p.from === u ? `Pay ${cap(p.to)}` : `Get from ${cap(p.from)}`}</b></div>
      <div class="r"><b class="${p.from === u ? 'red' : 'green'}">${inr(p.amount)}</b></div></div>`).join('') : ''}
  </div>

  <div class="card"><h2>How this is worked out</h2>
    ${line('Paid for shop expenses', t.paid[u], '+ ')}
    ${tr.filter(e => e.person === u).map(e => line('Gave to ' + cap(e.to_person), e.amount, '+ ')).join('')}
    ${tr.filter(e => e.to_person === u).map(e => line('Received from ' + cap(e.person), e.amount, '− ')).join('')}
    ${line('Sales cash collected', t.collected[u], '− ')}
    <div class="line"><span>${t.share >= 0 ? 'Equal share of cost' : 'Equal share of profit'}</span><b>${t.share >= 0 ? '− ' : '+ '}${inr(Math.abs(t.share))}</b></div>
    <div class="line total"><span>Balance</span><span class="${cls}">${txt}</span></div>
  </div>

  ${tr.length ? `<div class="card"><h2>Money between partners</h2>${tr.map(e => `<div class="row"><div class="l">
    <b>${e.person === u ? `Gave to ${cap(e.to_person)}` : `Received from ${cap(e.person)}`}</b><small>${fmtDate(e.date)}${e.note ? ' · ' + esc(e.note) : ''}</small></div>
    <div class="r"><b>${inr(e.amount)}</b></div></div>`).join('')}</div>` : ''}

  <div class="card"><h2>Expenses paid · ${inr(t.paid[u])}</h2>${exp.length ? exp.map(e => `<div class="row"><div class="l"><b>${esc(e.note)}</b><small>${fmtDate(e.date)} · ${esc(e.category)}</small></div>
    <div class="r"><b class="red">${inr(e.amount)}</b></div></div>`).join('') : '<span class="mute">None</span>'}</div>

  ${sal.length ? `<div class="card"><h2>Sales cash collected · ${inr(t.collected[u])}</h2>${sal.map(e => `<div class="row"><div class="l"><b>${esc(e.note) || 'Sale'}</b><small>${fmtDate(e.date)}</small></div>
    <div class="r"><b class="green">${inr(e.amount)}</b></div></div>`).join('')}</div>` : ''}`;
}

function formView(type) {
  const opts = sel => USERS.map(u => `<option value="${u}" ${u===sel?'selected':''}>${cap(u)}</option>`).join('');
  if (type === 'transfer') return `<form id="f" class="card" data-type="transfer">
    <h2>Money given between partners</h2>
    <small class="mute">e.g. Babu gave ₹50,000 to Shiva for stock</small>
    <label>Given by</label><select name="person">${opts(me)}</select>
    <label>Given to</label><select name="to_person">${opts(USERS.find(u => u !== me))}</select>
    <label>Amount (₹)</label><input name="amount" type="number" inputmode="numeric" min="1" required>
    <label>Note (optional)</label><input name="note" maxlength="100" placeholder="e.g. for goods purchase">
    <label>Date</label><input name="date" type="date" value="${today()}" required>
    <button class="btn green">Save</button>
  </form>`;
  const isE = type === 'expense';
  return `<form id="f" class="card" data-type="${type}">
    <h2>${isE ? 'Add expense' : 'Add sale'}</h2>
    <label>Amount (₹)</label><input name="amount" type="number" inputmode="numeric" min="1" required>
    ${isE ? `<label>Category</label><select name="category">${CATS.map(c => `<option>${c}</option>`).join('')}</select>` : ''}
    <label>${isE ? 'What for? (note)' : 'Note (optional, e.g. day 1 counter)'}</label><input name="note" ${isE ? 'required' : ''} maxlength="100" placeholder="${isE ? 'e.g. Fireworks from Shiva, Kasi' : ''}">
    <label>${isE ? 'Paid by' : 'Cash collected by'}</label><select name="person">${opts(me)}</select>
    <label>Date</label><input name="date" type="date" value="${today()}" required>
    <button class="btn ${isE ? '' : 'gold'}">${isE ? 'Save expense' : 'Save sale'}</button>
  </form>`;
}

function listView(list, type) {
  const total = list.reduce((a, e) => a + e.amount, 0);
  const title = e => type === 'transfer' ? `${cap(e.person)} → ${cap(e.to_person)}` : esc(e.note) || (type === 'sale' ? 'Sale' : '');
  const sub = e => type === 'transfer' ? (e.note ? ' · ' + esc(e.note) : '') : ` · ${cap(e.person)}${e.category ? ' · ' + esc(e.category) : ''}`;
  const color = {expense: 'red', sale: 'green', transfer: ''}[type];
  return `<div class="card"><h2>${list.length} entries · ${inr(total)}</h2>
    ${list.length ? list.map(e => `<div class="row">
      <div class="l"><b>${title(e)}</b>
        <small>${fmtDate(e.date)}${sub(e)}${e.addedBy && e.addedBy !== e.person ? ' · added by ' + cap(e.addedBy) : ''}</small></div>
      <div class="r"><b class="${color}">${inr(e.amount)}</b><button class="del" data-id="${e.id}" aria-label="Delete">✕</button></div>
    </div>`).join('') : '<span class="mute">Nothing yet</span>'}</div>`;
}

async function saveEntry(entry) {
  try { await store.add(entry); return true; }
  catch (e) {
    alert(entry.type === 'transfer' && /check constraint|to_person/i.test(e.message)
      ? 'Partner payments are not switched on in the database yet. Ask Ajay to run the setup SQL.'
      : 'Could not save: ' + e.message);
    return false;
  }
}

async function submit(ev) {
  ev.preventDefault();
  const f = ev.target, d = new FormData(f), type = f.dataset.type;
  const entry = {type, amount: Number(d.get('amount')), note: d.get('note').trim(), person: d.get('person'), date: d.get('date'), addedBy: me};
  if (type === 'expense') entry.category = d.get('category');
  if (type === 'transfer') {
    entry.to_person = d.get('to_person');
    if (entry.to_person === entry.person) return alert('"Given by" and "Given to" must be different people.');
  }
  if (!(entry.amount > 0)) return;
  f.querySelector('button').disabled = true;
  if (!await saveEntry(entry)) f.querySelector('button').disabled = false;
}
</script>
